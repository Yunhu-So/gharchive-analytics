x-airflow-common: &airflow-common
  image: apache/airflow:3.3.0-python3.12
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # LocalExecutor forks worker processes; if that happens while the
    # scheduler's log-server thread is already running, the fork can
    # deadlock the child (reproduced consistently even against a fresh
    # metadata DB, so it isn't data-dependent). spawn avoids inheriting
    # thread state across the fork instead of copying it.
    AIRFLOW__CORE__MP_START_METHOD: "spawn"
    AIRFLOW__WORKERS__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    # must be identical across every component: the apiserver signs task
    # execution JWTs with this key and the scheduler/dag-processor/triggerer
    # verify against it. Left unset, each container generates its own
    # ephemeral key and no two components can talk to each other.
    AIRFLOW__API__SECRET_KEY: "${AIRFLOW_SECRET_KEY:-60cbd419a9a6ce4ac6b98884a521147ad3c30127b9b9aa3b170a605f9dfaab86}"
    # a second, independent secret from [api] secret_key: this is the one
    # actually used to sign/verify task execution JWTs between components.
    AIRFLOW__API_AUTH__JWT_SECRET: "${AIRFLOW_SECRET_KEY:-60cbd419a9a6ce4ac6b98884a521147ad3c30127b9b9aa3b170a605f9dfaab86}"
    AIRFLOW_UID: "${AIRFLOW_UID:-50000}"
    DUCKDB_PATH: /opt/airflow/data/gharchive.duckdb
    DBT_PROFILES_DIR: /opt/airflow/dbt
    BRONZE_ROOT: /opt/airflow/data/bronze
    BRONZE_PATH: /opt/airflow/data/bronze
    GHARCHIVE_BASE_URL: "${GHARCHIVE_BASE_URL:-https://data.gharchive.org}"
    GHARCHIVE_MAX_CONCURRENT_DOWNLOADS: "${GHARCHIVE_MAX_CONCURRENT_DOWNLOADS:-8}"
    GHARCHIVE_LOOKBACK_DAYS: "${GHARCHIVE_LOOKBACK_DAYS:-90}"
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-core==1.10.* dbt-duckdb dbt-bigquery astronomer-cosmos duckdb pyarrow"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
    - ./bronze:/opt/airflow/data/bronze
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    - airflow-data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@example.com || true
        airflow pools set gharchive_download_pool "${GHARCHIVE_MAX_CONCURRENT_DOWNLOADS:-8}" "caps concurrent GH Archive downloads during backfill"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-db-volume:
  airflow-data:
