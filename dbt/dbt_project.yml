name: gharchive
version: "1.0.0"
config-version: 2

profile: gharchive

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]
clean-targets: ["target", "dbt_packages"]

vars:
  marts_start_date: "2015-01-01"
  bronze_path: "../bronze"
  bq_allow_dml: false
  pr_lifecycle_lookback_days: 90
  pr_lifecycle_max_age_days: 365
  first_contributor_uncertainty_days: 90

models:
  gharchive:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
      int_pr_lifecycle:
        +materialized: incremental
    marts:
      +materialized: table
      +schema: marts

seeds:
  gharchive:
    known_bot_actors:
      +column_types:
        login: varchar
        reason: varchar
