version: 2

sources:
  - name: bronze_timeline
    meta:
      external_location: "read_parquet('{{ env_var('TIMELINE_BRONZE_PATH', var('timeline_bronze_path')) }}/dt=*/hour=*/*.parquet', hive_partitioning=true, union_by_name=true)"
    tables:
      - name: events
        description: >
          One-month demonstration of pre-2015 Timeline API events (ADR 004).
          Not unioned into any 2015+ staging or mart model.
