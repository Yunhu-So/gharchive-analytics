gharchive:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DUCKDB_PATH', '../gharchive.duckdb') }}"
      threads: "{{ env_var('DUCKDB_THREADS', '2') | int }}"
      extensions:
        - httpfs
      settings:
        memory_limit: "{{ env_var('DUCKDB_MEMORY_LIMIT', '4GB') }}"
        # top-level `threads:` above only controls dbt's model concurrency;
        # duckdb's own internal query engine parallelism is unrelated and
        # defaults to using every available core unless set here explicitly.
        # a wide union of windowed views run with full core parallelism can
        # blow past a `memory_limit` several times its intended size, since
        # each thread buffers its own intermediate state.
        threads: "{{ env_var('DUCKDB_THREADS', '2') | int }}"
        preserve_insertion_order: false
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('BQ_PROJECT') }}"
      dataset: "{{ env_var('BQ_DATASET', 'gharchive') }}"
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      job_execution_timeout_seconds: 300
      job_retries: 1
