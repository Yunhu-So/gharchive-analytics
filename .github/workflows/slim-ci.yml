name: slim-ci

on:
  pull_request:
    paths:
      - "dbt/**"

env:
  PYTHON_VERSION: "3.12"

jobs:
  slim-dbt-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install project dependencies
        run: pip install dbt-core==1.10.* dbt-duckdb

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      # dbt/target is gitignored, so there is no committed manifest to
      # diff against; ci.yml uploads one from its own build on every push
      # to main, which is the only place a baseline can come from. A
      # pull request opened before main has ever built one won't find it,
      # hence continue-on-error and the plain file-existence fallback below.
      - name: find latest main ci run
        id: find-run
        run: |
          run_id=$(gh run list --workflow=ci.yml --branch=main --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # both the manifest (for state:modified+ to diff against) and the
      # actual warehouse file (so unchanged tables it decides not to
      # rebuild, like the known_bot_actors seed, already exist) are
      # needed: a fresh CI runner starts with neither.
      - name: restore dbt state from main
        if: steps.find-run.outputs.run_id != ''
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dbt-state-main
          path: dbt/state_main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.find-run.outputs.run_id }}

      # upload-artifact preserves the repo-root-relative paths it was given
      # (dbt/target/manifest.json, ci.duckdb), so downloading into
      # dbt/state_main nests them at dbt/state_main/dbt/target/... and
      # dbt/state_main/ci.duckdb.
      - name: dbt build state:modified+
        working-directory: dbt
        run: |
          if [ -f state_main/dbt/target/manifest.json ]; then
            cp state_main/ci.duckdb ../slim-ci.duckdb
            dbt build --target dev --select state:modified+ --exclude tag:timeline_demo --state state_main/dbt/target
          else
            dbt build --target dev --exclude tag:timeline_demo
          fi
        env:
          DUCKDB_PATH: ../slim-ci.duckdb
          BRONZE_PATH: ../tests/fixtures/sample_bronze
